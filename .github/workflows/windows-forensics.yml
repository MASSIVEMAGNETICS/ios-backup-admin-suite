name: Windows Forensics Suite

on:
  push:
    branches:
      - main
      - agent/windows-forensics-suite
    paths:
      - "Windows/ForgeRecover/**"
      - ".github/workflows/windows-forensics.yml"
  pull_request:
    paths:
      - "Windows/ForgeRecover/**"
      - ".github/workflows/windows-forensics.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows products
        shell: pwsh
        run: |
          dotnet restore Windows/ForgeRecover/src/ForgeRecover.Cli/ForgeRecover.Cli.csproj --runtime win-x64
          dotnet restore Windows/ForgeRecover/src/ForgeRecover.App/ForgeRecover.App.csproj --runtime win-x64
          dotnet restore Windows/ForgeRecover/tests/ForgeRecover.Core.Tests/ForgeRecover.Core.Tests.csproj

      - name: Build Windows products
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/diagnostics | Out-Null
          $ErrorActionPreference = 'Continue'
          $logs = @()

          $cliOutput = dotnet build Windows/ForgeRecover/src/ForgeRecover.Cli/ForgeRecover.Cli.csproj --configuration Release --runtime win-x64 --no-restore 2>&1
          $cliExit = $LASTEXITCODE
          $logs += '===== CLI BUILD ====='
          $logs += $cliOutput

          $appOutput = dotnet build Windows/ForgeRecover/src/ForgeRecover.App/ForgeRecover.App.csproj --configuration Release --runtime win-x64 --no-restore 2>&1
          $appExit = $LASTEXITCODE
          $logs += '===== WORKBENCH BUILD ====='
          $logs += $appOutput

          $logs | Tee-Object -FilePath artifacts/diagnostics/build.log | Write-Host
          if ($cliExit -ne 0 -or $appExit -ne 0) { exit 1 }

      - name: Run deterministic tests
        if: steps.build.outcome == 'success'
        run: dotnet test Windows/ForgeRecover/tests/ForgeRecover.Core.Tests/ForgeRecover.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=forge-recover-tests.trx" --collect "XPlat Code Coverage"

      - name: Publish Windows x64 suite
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $suite = 'artifacts/forge-recover-windows-x64'
          $cli = Join-Path $suite 'cli'
          $workbench = Join-Path $suite 'workbench'
          New-Item -ItemType Directory -Force $cli, $workbench | Out-Null

          dotnet publish Windows/ForgeRecover/src/ForgeRecover.Cli/ForgeRecover.Cli.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $cli

          dotnet publish Windows/ForgeRecover/src/ForgeRecover.App/ForgeRecover.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $workbench

          Copy-Item Windows/ForgeRecover/README.md (Join-Path $suite 'README.md')
          if (Test-Path Windows/ForgeRecover/WORKBENCH.md) {
            Copy-Item Windows/ForgeRecover/WORKBENCH.md (Join-Path $suite 'WORKBENCH.md')
          }

          & (Join-Path $cli 'forge-recover.exe') help | Tee-Object -FilePath (Join-Path $suite 'cli-smoke-test.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Published CLI smoke test failed.' }

          $hashLines = Get-ChildItem $suite -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath((Resolve-Path $suite), $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            }
          $hashLines | Set-Content (Join-Path $suite 'SHA256SUMS.txt') -Encoding utf8

          if (-not (Test-Path (Join-Path $workbench 'ForgeRecover.Workbench.exe'))) {
            throw 'Workbench executable was not published.'
          }

      - name: Upload Windows suite
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: forge-recover-windows-x64
          path: artifacts/forge-recover-windows-x64
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-recover-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-recover-test-results
          path: Windows/ForgeRecover/tests/ForgeRecover.Core.Tests/TestResults
          if-no-files-found: warn

      - name: Report compiler failure on pull request
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $matches = Get-Content artifacts/diagnostics/build.log |
            Select-String -Pattern 'error (CS|CA|NETSDK|NU|MC|XDG)[0-9]+|error:' |
            Select-Object -Last 100 |
            ForEach-Object { $_.Line }
          if (-not $matches) {
            $matches = Get-Content artifacts/diagnostics/build.log | Select-Object -Last 100
          }
          $body = @(
            '### ForgeRecover compiler diagnostics',
            '',
            '```text',
            ($matches -join "`n"),
            '```'
          ) -join "`n"
          $body | Set-Content artifacts/diagnostics/pr-comment.md
          gh pr comment $env:PR_NUMBER --repo $env:REPOSITORY --body-file artifacts/diagnostics/pr-comment.md

      - name: Enforce build gate
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1
